<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Bug Review</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #111418;
      color: #eef2f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header,
    footer {
      padding: 12px 16px;
      background: #191e24;
      border-bottom: 1px solid #2b333d;
    }

    footer {
      border-top: 1px solid #2b333d;
      border-bottom: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    main {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    video {
      width: min(100%, 1180px);
      max-height: calc(100vh - 150px);
      background: #000;
      outline: 1px solid #333b45;
    }

    button {
      color: #edf4ff;
      background: #2f6fdd;
      border: 0;
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
    }

    button.secondary {
      background: #2b333d;
    }

    #status {
      margin-left: auto;
      color: #b6c1cb;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <header>Video Bug Review</header>
  <main>
    <video id="video" controls preload="metadata" src="file:///E:/obs/zhou/2026-08-06%2015-11-43.mkv"></video>
  </main>
  <footer>
    <button class="secondary" data-step="-5">-5s</button>
    <button class="secondary" data-step="-1">-1s</button>
    <button data-rate="0.25">0.25x</button>
    <button data-rate="0.5">0.5x</button>
    <button data-rate="1">1x</button>
    <button class="secondary" data-step="1">+1s</button>
    <button class="secondary" data-step="5">+5s</button>
    <span id="status">loading</span>
  </footer>
  <script>
    const video = document.querySelector("#video");
    const status = document.querySelector("#status");

    function fmt(value) {
      if (!Number.isFinite(value)) return "--:--";
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function update() {
      status.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)} ready=${video.readyState}`;
    }

    document.querySelectorAll("[data-step]").forEach((button) => {
      button.addEventListener("click", () => {
        video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + Number(button.dataset.step)));
        update();
      });
    });

    document.querySelectorAll("[data-rate]").forEach((button) => {
      button.addEventListener("click", () => {
        video.playbackRate = Number(button.dataset.rate);
        update();
      });
    });

    video.addEventListener("loadedmetadata", update);
    video.addEventListener("timeupdate", update);
    video.addEventListener("error", update);
    update();
  </script>
</body>
</html>
